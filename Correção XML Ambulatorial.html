<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atualizador TISS - Unificado</title>
<link rel="icon" href="https://hospitalauxiliadora.com.br/wp-content/uploads/2025/03/logo-hospital-auxiliadora.png" />

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-color: #00e0ff;
    --bg-glass: rgba(16, 24, 39, 0.8);
    --border-glass: rgba(255, 255, 255, 0.1);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, rgba(10, 15, 30, 0.95), rgba(0, 0, 0, 0.9)),
                url('https://hospitalauxiliadora.com.br/wp-content/uploads/2025/03/img-onde-estamos-1024x657.png') no-repeat center center fixed;
    background-size: cover;
    color: var(--text-main);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center; padding: 20px;
  }

  .app-container {
    background: var(--bg-glass);
    backdrop-filter: blur(15px);
    border: 1px solid var(--border-glass);
    border-radius: 24px;
    padding: 35px;
    width: 100%; max-width: 650px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  header { text-align: center; margin-bottom: 25px; }
  h1 { font-size: 1.6rem; background: linear-gradient(90deg, #fff, var(--primary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .file-drop-area {
    position: relative; display: flex; align-items: center; padding: 15px;
    border: 2px dashed var(--border-glass); border-radius: 12px; margin-bottom: 15px;
    background: rgba(255, 255, 255, 0.03); transition: 0.3s;
  }
  .file-drop-area:hover { border-color: var(--primary-color); background: rgba(0, 224, 255, 0.05); }
  .file-icon { font-size: 1.5rem; margin-right: 12px; color: var(--text-muted); }
  .file-input { position: absolute; left: 0; top: 0; height: 100%; width: 100%; cursor: pointer; opacity: 0; }
  .file-name { color: var(--primary-color); font-weight: 600; font-size: 0.9rem; }

  .options-group {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px; border-radius: 12px; margin-bottom: 25px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .check-item {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    font-size: 0.95rem; padding: 8px; border-radius: 8px; transition: 0.2s;
  }
  .check-item:hover { background: rgba(255, 255, 255, 0.05); }
  .check-item input { width: 18px; height: 18px; accent-color: var(--primary-color); }
  .check-item i { width: 20px; text-align: center; color: var(--primary-color); }

  .btn-main {
    width: 100%; padding: 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
  }
  .btn-main:hover { transform: translateY(-2px); filter: brightness(1.1); }

  .log-container {
    margin-top: 20px; background: rgba(0, 0, 0, 0.4); border-radius: 12px;
    padding: 15px; max-height: 250px; overflow-y: auto; display: none;
    font-size: 0.85rem; border-left: 4px solid var(--primary-color);
  }
  .success { color: #4ade80; }
  .error { color: #f87171; }
  .loader {
    display: none; margin: 15px auto; border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid var(--primary-color); border-radius: 50%;
    width: 30px; height: 30px; animation: spin 1s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* ESTILO DA MARCA AZAMBUJA */
  .footer-brand {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid var(--border-glass);
    text-align: center;
  }
  .brand {
    font-weight: 800; 
    letter-spacing: 4px; 
    color: var(--text-muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Validador & Atualizador TISS</h1>
    <p style="color: var(--text-muted); font-size: 0.85rem;">AXON</p>
  </header>

  <div class="file-drop-area">
    <i class="fa-solid fa-file-code file-icon"></i>
    <span class="file-name" id="xmlName">Selecionar XML TISS</span>
    <input type="file" id="xmlFile" class="file-input" accept=".xml" onchange="updateName('xmlFile', 'xmlName')">
  </div>

  <div class="file-drop-area">
    <i class="fa-solid fa-file-excel file-icon" style="color: #10b981;"></i>
    <span class="file-name" id="excelName">Selecionar Excel De/Para (Opcional)</span>
    <input type="file" id="excelFile" class="file-input" accept=".xlsx,.xls" onchange="updateName('excelFile', 'excelName')">
  </div>

  <div class="options-group">
    <label class="check-item">
      <input type="checkbox" id="checkGatto" checked>
      <i class="fa-solid fa-user-doctor"></i>
      Substituir Código Prestador (11000101 → 16983 gatto)
    </label>
    
    <label class="check-item">
      <input type="checkbox" id="checkExcel" checked>
      <i class="fa-solid fa-table"></i>
      Trocar Guias de Prestador conforme Excel
    </label>

    <label class="check-item">
      <input type="checkbox" id="checkZeros">
      <i class="fa-solid fa-0"></i>
      Completar zeros à esquerda (7 dígitos)
    </label>
  </div>

  <button id="processBtn" class="btn-main">
    <i class="fa-solid fa-wand-magic-sparkles"></i> PROCESSAR E VALIDAR
  </button>

  <div class="loader" id="loader"></div>
  <div class="log-container" id="log"></div>

  <footer class="footer-brand">
    <div class="brand">AZAMBUJA</div>
    <div style="font-size: 0.65rem; color: rgba(156, 163, 175, 0.5); margin-top: 5px; letter-spacing: 1px;">© 2026 | TODOS OS DIREITOS RESERVADOS</div>
  </footer>
</div>

<script>
  function updateName(inputId, spanId) {
    const file = document.getElementById(inputId).files[0];
    if (file) document.getElementById(spanId).textContent = file.name;
  }

  async function lerExcel(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const mapa = new Map();
        rows.forEach((row, i) => {
          if (i > 0 && row[0] && row[1]) {
            const key = row[0].toString().trim().replace(/^0+/, '') || '0';
            mapa.set(key, row[1].toString().trim());
          }
        });
        resolve(mapa);
      };
      reader.readAsArrayBuffer(file);
    });
  }

  document.getElementById('processBtn').addEventListener('click', async () => {
    const xmlFile = document.getElementById('xmlFile').files[0];
    const excelFile = document.getElementById('excelFile').files[0];
    const doGatto = document.getElementById('checkGatto').checked;
    const doExcel = document.getElementById('checkExcel').checked;
    const doZeros = document.getElementById('checkZeros').checked;
    const logEl = document.getElementById('log');
    const loader = document.getElementById('loader');

    if (!xmlFile) return alert("Selecione o arquivo XML!");
    if (doExcel && !excelFile) return alert("Para usar a opção de Excel, anexe o arquivo .xlsx!");

    loader.style.display = 'block';
    logEl.style.display = 'none';
    logEl.innerHTML = '';

    try {
      const xmlText = await xmlFile.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "application/xml");
      let logs = [];
      let alteracoes = 0;

      // 1. LÓGICA DR GATTO (11000101 -> 16983)
      if (doGatto) {
        const codNodes = Array.from(xmlDoc.getElementsByTagName('*')).filter(el => el.localName === 'codigoPrestadorNaOperadora');
        codNodes.forEach(node => {
          if (node.textContent.trim() === '11000101') {
            node.textContent = '16983';
            alteracoes++;
            logs.push(`<div class="success">✔ Código Prestador: 11000101 alterado para '16983'</div>`);
          }
        });
      }

      // 2. LÓGICA EXCEL (GUIAS)
      if (doExcel) {
        const mapaExcel = await lerExcel(excelFile);
        const opNodes = Array.from(xmlDoc.getElementsByTagName('*')).filter(el => el.localName === 'numeroGuiaOperadora');

        opNodes.forEach(opNode => {
          const valorOp = opNode.textContent.trim();
          const key = valorOp.replace(/^0+/, '') || '0';

          if (mapaExcel.has(key)) {
            let novoValor = mapaExcel.get(key);
            if (doZeros) novoValor = novoValor.padStart(7, '0');

            // Busca tag prestador subindo para o pai da guia (Busca Profunda)
            const guiaBloco = opNode.parentNode;
            const prestNodes = Array.from(guiaBloco.getElementsByTagName('*')).filter(el => el.localName === 'numeroGuiaPrestador');

            if (prestNodes.length > 0) {
              prestNodes[0].textContent = novoValor;
              alteracoes++;
              logs.push(`<div class="success">✔ Guia Op ${valorOp} → Prestador: ${novoValor}</div>`);
            }
          }
        });
      }

      // Finalização
      if (alteracoes > 0) {
        const xmlString = new XMLSerializer().serializeToString(xmlDoc);
        const blob = new Blob([xmlString], { type: "application/xml" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "TISS_PROCESSADO_AZAMBUJA.xml";
        link.click();
        logEl.innerHTML = `<strong>Sucesso! ${alteracoes} alterações feitas.</strong><br>` + logs.join('');
      } else {
        logEl.innerHTML = `<div class="error">Nenhuma alteração foi necessária com base nas opções marcadas.</div>`;
      }
      logEl.style.display = 'block';

    } catch (e) {
      alert("Erro no processamento: " + e.message);
    } finally {
      loader.style.display = 'none';
    }
  });
</script>
</body>
</html>
