<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buscar e Substituir Conteúdo no XML</title>

<style>
  body {
      background:
        linear-gradient(135deg, rgba(20, 30, 48, 0.8), rgba(0, 0, 0, 0.9)),
        url('https://hospitalauxiliadora.com.br/wp-content/uploads/2025/03/img-onde-estamos-1024x657.png')
        no-repeat center center fixed;
      background-size: cover;

      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: #d4cdcd;

      max-width: 900px;
      margin: 40px auto;
      padding: 30px;

      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
  }

  h2 {
    color: #00e0ff;
    text-shadow: 0 0 8px rgba(0, 224, 255, 0.6);
    text-align: center;
    margin-bottom: 20px;
  }

  label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }

  input[type="file"], input[type="text"] {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #00e0ff;
    background: rgba(0,0,0,0.4);
    color: #fff;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 5px;
  }

  button:hover {
    background: linear-gradient(90deg, #0072ff, #00c6ff);
    transform: scale(1.05);
  }

  #downloadBtn {
    margin-left: 10px;
  }

  pre {
    white-space: pre-wrap;
    background: rgba(0,0,0,0.4);
    padding: 18px;
    border-radius: 8px;
    border: 1px solid #00e0ff;
    max-height: 450px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    margin-top: 20px;
    color: #87ff8a;
  }

</style>
</head>

<body>

  <h2>Buscar e Substituir Conteúdo no XML</h2>

  <input type="file" id="fileInput" accept=".xml" />
  <input type="text" id="searchValue" placeholder="Texto a buscar" />
  <input type="text" id="replaceValue" placeholder="Texto para substituir" />

  <button onclick="processXml()">Substituir</button>
  <button id="downloadBtn" style="display:none;" onclick="downloadXml()">Baixar XML Modificado</button>

  <h3 style="color:#00e0ff; margin-top:25px;">XML Resultante:</h3>
  <pre id="resultArea">Carregue um arquivo XML para começar.</pre>

  <script>
    let xmlDoc = null;
    let serializer = new XMLSerializer();
    let modifiedXmlString = '';

    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const parser = new DOMParser();
        try {
          xmlDoc = parser.parseFromString(e.target.result, "application/xml");
          const parseError = xmlDoc.querySelector("parsererror");
          if (parseError) {
            alert("Erro ao analisar o XML: " + parseError.textContent);
            xmlDoc = null;
            return;
          }

          modifiedXmlString = formatXml(e.target.result);
          document.getElementById('resultArea').textContent = modifiedXmlString;
          document.getElementById('downloadBtn').style.display = 'none';

        } catch (error) {
          alert("Erro ao processar arquivo: " + error.message);
          xmlDoc = null;
        }
      };
      reader.readAsText(file);
    });

    function processXml() {
      if (!xmlDoc) {
        alert('Por favor, carregue um arquivo XML válido primeiro.');
        return;
      }
      const search = document.getElementById('searchValue').value;
      const replace = document.getElementById('replaceValue').value;
      if (search === '') {
        alert('Por favor, informe o texto a ser buscado.');
        return;
      }

      function replaceTextNodes(node) {
        node.childNodes.forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) {
            child.nodeValue = child.nodeValue.split(search).join(replace);
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            replaceTextNodes(child);
          }
        });
      }

      replaceTextNodes(xmlDoc.documentElement);

      modifiedXmlString = serializer.serializeToString(xmlDoc);
      modifiedXmlString = formatXml(modifiedXmlString);

      document.getElementById('resultArea').textContent = modifiedXmlString;
      document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function formatXml(xml) {
      let formatted = '';
      const reg = /(>)(<)(\/*)/g;
      xml = xml.replace(reg, '$1\n$2$3');
      let pad = 0;
      xml.split('\n').forEach((node) => {
        let indent = 0;
        if (node.match(/.+<\/\w[^>]*>$/)) {
          indent = 0;
        } else if (node.match(/^<\/\w/)) {
          if (pad !== 0) pad -= 1;
        } else if (node.match(/^<\w[^>]*[^\/]>.*$/)) {
          indent = 1;
        }
        formatted += '  '.repeat(pad) + node + '\n';
        pad += indent;
      });
      return formatted.trim();
    }

    function downloadXml() {
      const blob = new Blob([modifiedXmlString], {type: 'application/xml'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = 'modificado.xml';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
	

</body>
</html>
