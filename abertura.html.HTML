<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Abertura de Chamado - Cadastro de Regras</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f0f2f5;
  }
  .container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px #ccc;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 12px 20px;
    background: #0072ff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background: #005bb5;
  }
  #message {
    text-align: center;
    margin-top: 15px;
    color: green;
  }
</style>
</head>
<body>

<div class="container">
  <h2 style="text-align:center;">Abertura de Chamado - Cadastro de Regras</h2>
  <form id="formChamado">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" required />

    <label for="email">E-mail:</label>
    <input type="email" id="email" required />

    <label for="departamento">Departamento:</label>
    <select id="departamento" required>
      <option value="">Selecione</option>
      <option value="Financeiro">Financeiro</option>
      <option value="TI">TI</option>
      <option value="RH">RH</option>
      <option value="Comercial">Comercial</option>
    </select>

    <label for="descricao">Descrição do chamado:</label>
    <textarea id="descricao" rows="4" required></textarea>

    <button type="submit">Enviar Chamado</button>
  </form>
  <div id="message"></div>
</div>

<script>
  const form = document.getElementById('formChamado');
  const message = document.getElementById('message');

  function pegarChamados() {
    let chamados = localStorage.getItem('chamados');
    return chamados ? JSON.parse(chamados) : [];
  }

  function salvarChamados(chamados) {
    localStorage.setItem('chamados', JSON.stringify(chamados));
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const departamento = document.getElementById('departamento').value;
    const descricao = document.getElementById('descricao').value.trim();
    const data = new Date().toLocaleString();

    if (!nome || !email || !departamento || !descricao) {
      message.style.color = 'red';
      message.textContent = 'Por favor, preencha todos os campos.';
      return;
    }

    const chamados = pegarChamados();
    chamados.push({Nome: nome, Email: email, Departamento: departamento, Descrição: descricao, Data: data});
    salvarChamados(chamados);

    message.style.color = 'green';
    message.textContent = 'Chamado enviado com sucesso!';
    form.reset();
  });
</script>

</body>
</html>
