            --bg-page: #0f172a;           
            --card-bg: #1e293b;           
            --code-bg: #0f172a;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-page); color: var(--text-main); margin: 0; transition: background 0.3s; }

        /* Login */
        #login-overlay { position: fixed; inset: 0; background: var(--bg-page); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid var(--border-light); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border-light); background: var(--bg-page); color: var(--text-main); text-align: center; outline: none; }
        .login-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-brand); color: white; font-weight: bold; cursor: pointer; }

        /* Layout */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        /* Filtros */
        .filter-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .filter-btn { padding: 10px 20px; border-radius: 99px; border: 1px solid var(--border-light); background: var(--card-bg); color: var(--text-muted); cursor: pointer; font-weight: 500; transition: 0.2s; }
        .filter-btn.active { background: var(--accent-brand); color: white; border-color: var(--accent-brand); }

        /* Tabela e Estilos Originais */
        .search-box { background: var(--card-bg); border-radius: 99px; display: flex; margin-bottom: 20px; border: 1px solid var(--border-light); overflow: hidden; }
        #busca { flex: 1; border: none; padding: 15px 25px; outline: none; background: transparent; color: var(--text-main); }
        .table-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-light); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: var(--primary-light); font-size: 0.8rem; color: var(--text-muted); }
        td { padding: 15px; border-bottom: 1px solid var(--border-light); }
        .sector-badge { font-size: 0.7rem; background: var(--code-bg); padding: 4px 10px; border-radius: 4px; font-weight: 700; }
        .price-tag { background: var(--price-bg); color: var(--price-text); padding: 5px 10px; border-radius: 6px; font-weight: 700; }
        
        .theme-toggle { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--border-light); background: var(--card-bg); color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-logout { background: #fee2e2; color: #ef4444; border-color: #fecaca; }
    </style>
</head>

    function validarAcesso() {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        if (USUARIOS[u] && USUARIOS[u] === p) {
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    function fazerLogout() { window.location.reload(); }

    function initFilters() {
        const sectors = ["TODOS", ...new Set(DATA.map(d => d.s))];
        const container = document.getElementById('filter-group');
        container.innerHTML = sectors.map(s => `
            <button class="filter-btn ${s === 'TODOS' ? 'active' : ''}" onclick="filterBy('${s}', this)">${s}</button>
        `).join('');
    }

    function filterBy(sector, btn) {
        currentFilter = sector;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const search = document.getElementById('busca').value.toLowerCase();
        const tbody = document.getElementById('tabela');
        
        const filtered = DATA.filter(d => {
            const matchesSearch = d.p.toLowerCase().includes(search) || d.c.toLowerCase().includes(search);
            const matchesSector = currentFilter === "TODOS" || d.s === currentFilter;
            return matchesSearch && matchesSector;
        });

        document.getElementById('counter').innerText = `${filtered.length} Procedimentos Localizados`;

        tbody.innerHTML = filtered.map(d => `
            <tr>
                <td><span class="sector-badge">${d.s}</span></td>
                <td>
                    <div style="font-weight:600">${d.p}</div>
                    <div style="font-size:0.7rem; color:var(--text-muted)">${d.c || 'AGUARDANDO VALIDAÇÃO'}</div>
                </td>
                <td style="font-weight:700">R$ ${d.v1.toFixed(2)}</td>
                <td><span class="price-tag">R$ ${d.v2.toFixed(2)}</span></td>
            </tr>
        `).join('');
    }

    // Eventos
    document.getElementById('busca').addEventListener('input', render);
    document.getElementById('theme-btn').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
    document.addEventListener('keypress', (e) => { if(e.key === 'Enter') validarAcesso(); });

    window.onload = () => {
        initFilters();
        render();
    };
</script>
