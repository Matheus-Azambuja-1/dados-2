<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Portal | Grupo Azambuja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Modo Claro (Light Mode) */
            --primary-dark: #0f172a;      
            --primary-light: #f8fafc;     
            --accent-brand: #0ea5e9;      
            --accent-hover: #0284c7;      
            --text-main: #334155;         
            --text-muted: #64748b;        
            --border-light: #e2e8f0;      
            --price-bg: #ecfdf5;          
            --price-text: #059669;        
            --bg-page: #f1f5f9;           
            --card-bg: #ffffff;
            --code-bg: #f1f5f9;
        }

        /* Paleta Modo Escuro (Dark Mode) */
        body.dark-mode {
            --primary-dark: #f8fafc;      
            --primary-light: #1e293b;     
            --accent-brand: #38bdf8;      
            --accent-hover: #7dd3fc;      
            --text-main: #cbd5e1;         
            --text-muted: #94a3b8;        
            --border-light: #334155;      
            --price-bg: rgba(5, 150, 105, 0.15); 
            --price-text: #34d399;        
            --bg-page: #0f172a;           
            --card-bg: #1e293b;           
            --code-bg: #0f172a;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Modal de Login */
        #login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-page);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-light);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .login-card i {
            font-size: 3rem;
            color: var(--accent-brand);
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border-light);
            background: var(--bg-page);
            color: var(--primary-dark);
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .login-card input:focus { border-color: var(--accent-brand); }

        .login-card button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: var(--accent-brand);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .login-card button:hover { background: var(--accent-hover); }

        /* Estilos do Conteúdo Principal */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 40px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            font-size: 1.2rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .update-badge {
            display: inline-block;
            background-color: var(--card-bg);
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 500;
            border: 1px solid var(--border-light);
        }

        header h1 { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--primary-dark); 
            margin: 0; 
            letter-spacing: -1px; 
        }

        .search-box {
            background: var(--card-bg);
            border: 2px solid transparent;
            padding: 5px;
            border-radius: 99px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: flex;
            margin-bottom: 40px;
        }

        #busca {
            flex: 1;
            border: none;
            background: transparent;
            padding: 15px 30px;
            font-size: 1.1rem;
            outline: none;
            color: var(--primary-dark);
        }

        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }
        
        .chip {
            padding: 10px 20px;
            border-radius: 99px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }
        
        .chip.active { background: var(--accent-brand); color: white; border-color: var(--accent-brand); }

        .table-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 20px 24px;
            text-align: left;
            background: var(--primary-light);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-light);
        }

        tbody td { padding: 20px 24px; border-bottom: 1px solid var(--border-light); font-size: 0.95rem; }
        
        .proc-name { font-weight: 600; color: var(--primary-dark); display: block; }
        .proc-code { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-family: 'JetBrains Mono', monospace; 
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .proc-code.pendente { color: #ef4444; background: rgba(239, 68, 68, 0.1); font-weight: 600; }
        .price-tag { background: var(--price-bg); color: var(--price-text); padding: 8px 14px; border-radius: 8px; font-weight: 700; }
        
        .sector-badge { font-size: 0.7rem; background: var(--code-bg); padding: 6px 12px; border-radius: 99px; font-weight: 700; text-transform: uppercase; }

        @media print { .search-box, .filters, .theme-toggle, #login-overlay { display: none; } }
    </style>
</head>

<div id="login-overlay">
    <div class="login-card">
        <i class="fa-solid fa-layer-group"></i> <h2 style="color: var(--primary-dark); margin-bottom: 5px;">Portal de Pacotes</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem;">Área Restrita à Equipe de Faturamento</p>
        
        <input type="password" id="pass-input" placeholder="Digite a senha de acesso">
        <button onclick="validarAcesso()">Acessar Dados</button>
        <p id="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-top: 15px; display: none;">Senha incorreta. Tente novamente.</p>
    </div>
</div>

<div class="container">
    <button class="theme-toggle" id="theme-btn" title="Alternar Modo Escuro/Claro">🌓</button>

    <div class="update-badge">
        Atualizado em: <span id="data-update">27/02/2026</span>
    </div>

    <header>
        <h1>Custos de Pacotes</h1>
        <p style="color: var(--accent-brand); font-weight: 500; text-transform: uppercase; letter-spacing: 1px;">Inteligência de Dados e Faturamento</p>
    </header>

    <div class="search-box">
        <input type="text" id="busca" placeholder="Pesquise por procedimento, código ou 'aguardando'...">
    </div>

    <div class="filters" id="filtros">
        <button class="chip active" onclick="setFilter('TODOS', this)">Geral</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Setor</th>
                    <th>Procedimento</th>
                    <th>Valor Pacote</th>
                    <th>Valor Cartão</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>

    <footer style="margin-top: 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 20px;">
        <div class="count-info" id="counter" style="color: var(--text-muted); font-size: 0.9rem;">Buscando registros...</div>
        <div class="brand" style="font-weight: 800; letter-spacing: 4px; color: var(--text-muted);">AZAMBUJA</div>
    </footer>
</div>

<script>
    // --- LÓGICA DE LOGIN ---
    const SENHA_CORRETA = "60033487"; // Defina sua senha aqui

    function validarAcesso() {
        const input = document.getElementById('pass-input');
        const overlay = document.getElementById('login-overlay');
        const error = document.getElementById('error-msg');

        if (input.value === SENHA_CORRETA) {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            sessionStorage.setItem('pc_access', 'true');
        } else {
            error.style.display = 'block';
            input.style.borderColor = '#ef4444';
            input.value = '';
            input.focus();
        }
    }

    document.getElementById('pass-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') validarAcesso();
    });

        document.body.classList.add('dark-mode');
    }

        document.body.classList.toggle('dark-mode');

{ s: "PEDIATRIA", p: "Postectomia - Pediatria", c: "91040195-11000054", v1: 2250.00, v2: 1960.00 },
    ];

    // --- LÓGICA DE FILTROS E TABELA ---
    let currentFilter = "TODOS";

    function format(v) {
        return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function initFilters() {
        const container = document.getElementById('filtros');
        const setores = [...new Set(DATA.map(d => d.s))].sort();
        setores.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.innerText = s;
            btn.onclick = (e) => setFilter(s, e.target);
            container.appendChild(btn);
        });
    }

    function setFilter(s, el) {
        currentFilter = s;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function render() {
        const search = document.getElementById('busca').value.toLowerCase();
        const tbody = document.getElementById('tabela');
        
        const filtered = DATA.filter(d => {
            const finalCode = d.c.trim() === "" ? "AGUARDANDO CADASTRO" : d.c;
            const mS = currentFilter === "TODOS" || d.s === currentFilter;
            const mB = d.p.toLowerCase().includes(search) || finalCode.toLowerCase().includes(search);
            return mS && mB;
        });

        document.getElementById('counter').innerText = `${filtered.length} Procedimentos Localizados`;

        tbody.innerHTML = filtered.map(d => {
            const isPendente = d.c.trim() === "";
            const finalCode = isPendente ? "AGUARDANDO CADASTRO" : d.c;
            const codeClass = isPendente ? "proc-code pendente" : "proc-code";

            return `
            <tr>
                <td><span class="sector-badge">${d.s}</span></td>
                <td>
                    <span class="proc-name">${d.p}</span>
                    <span class="${codeClass}">${finalCode}</span>
                </td>
                <td class="price-main" style="font-weight:700; color: var(--primary-dark);">${format(d.v1)}</td>
                <td><span class="price-tag">${format(d.v2)}</span></td>
            </tr>
        `}).join('');
    }

    // --- EXECUÇÃO INICIAL ---
    window.onload = () => {
        // Verifica se já fez login nesta sessão
        if (sessionStorage.getItem('pc_access') === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
        }
        initFilters();
        render();
    };

    document.getElementById('busca').addEventListener('input', render);
</script>

</body>
